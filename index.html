<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunucu Girişi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg-deep:#0c120d;
    --bg-panel:#141d16;
    --grass:#6a9c3e;
    --grass-dark:#4a7229;
    --dirt:#7a5233;
    --stone:#8a8f87;
    --stone-dark:#3c433d;
    --text:#e6ede4;
    --text-dim:#9fb09a;
    --danger:#c65b4a;
    --gold:#e0b84a;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 15%, rgba(106,156,62,0.08), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(122,82,51,0.10), transparent 45%),
      var(--bg-deep);
    background-attachment:fixed;
    font-family:'JetBrains Mono', monospace;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow-x:hidden;
  }

  /* subtle block-grid texture */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size:32px 32px;
    pointer-events:none;
  }

  .wrap{
    width:100%;
    max-width:400px;
    position:relative;
  }

  .eyebrow{
    font-family:'Press Start 2P', monospace;
    font-size:9px;
    letter-spacing:1px;
    color:var(--grass);
    text-align:center;
    margin-bottom:14px;
    text-shadow:2px 2px 0 rgba(0,0,0,0.4);
  }

  /* pixel-stepped border panel, built with layered box-shadows (no external assets) */
  .panel{
    background:var(--bg-panel);
    padding:32px 28px 28px;
    position:relative;
    box-shadow:
      inset 0 0 0 4px var(--stone-dark),
      0 0 0 4px var(--bg-deep),
      0 0 0 8px var(--grass-dark),
      0 20px 50px rgba(0,0,0,0.5);
  }

  .panel::before, .panel::after{
    content:"";
    position:absolute;
    width:10px;
    height:10px;
    background:var(--grass);
  }
  .panel::before{ top:-8px; left:-8px; }
  .panel::after{ top:-8px; right:-8px; }

  h1{
    font-family:'Press Start 2P', monospace;
    font-size:15px;
    line-height:1.6;
    margin:0 0 6px;
    color:var(--text);
    text-align:center;
  }

  .sub{
    text-align:center;
    color:var(--text-dim);
    font-size:12.5px;
    margin:0 0 26px;
  }

  label{
    display:block;
    font-size:11px;
    color:var(--text-dim);
    margin:0 0 6px;
    letter-spacing:0.3px;
  }

  .field{ margin-bottom:16px; }

  input[type=email], input[type=password], input[type=text]{
    width:100%;
    padding:11px 12px;
    background:var(--bg-deep);
    border:2px solid var(--stone-dark);
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size:13.5px;
    outline:none;
    transition:border-color .15s ease;
  }
  input:focus{ border-color:var(--grass); }
  input::placeholder{ color:#5c675e; }

  .btn{
    width:100%;
    padding:13px;
    margin-top:6px;
    background:var(--grass);
    color:#0c120d;
    border:none;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:13.5px;
    letter-spacing:0.4px;
    cursor:pointer;
    box-shadow:0 4px 0 var(--grass-dark);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn:hover{ filter:brightness(1.05); }
  .btn:active{ transform:translateY(4px); box-shadow:0 0 0 var(--grass-dark); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .btn.secondary{
    background:var(--stone);
    box-shadow:0 4px 0 var(--stone-dark);
  }
  .btn.danger{
    background:var(--danger);
    box-shadow:0 4px 0 #8a3d31;
  }

  .toggle-row{
    text-align:center;
    margin-top:18px;
    font-size:12px;
    color:var(--text-dim);
  }
  .toggle-row button{
    background:none;
    border:none;
    color:var(--grass);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    cursor:pointer;
    text-decoration:underline;
    padding:0;
  }

  .msg{
    font-size:12px;
    padding:10px 12px;
    margin-bottom:16px;
    border-left:3px solid var(--grass);
    background:rgba(106,156,62,0.08);
    color:var(--text);
    display:none;
  }
  .msg.error{
    border-left-color:var(--danger);
    background:rgba(198,91,74,0.1);
  }
  .msg.show{ display:block; }

  /* --- account / dashboard view --- */
  .status-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    background:var(--bg-deep);
    border:2px solid var(--stone-dark);
    margin-bottom:18px;
  }
  .dot{
    width:9px; height:9px;
    background:var(--gold);
    flex-shrink:0;
  }
  .dot.ok{ background:var(--grass); }
  .status-text{ font-size:12px; color:var(--text-dim); line-height:1.5; }
  .status-text b{ color:var(--text); }

  .hidden{ display:none !important; }

  .link-btn{
    display:block;
    width:100%;
    text-align:center;
    background:none;
    border:none;
    color:var(--grass);
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    text-decoration:underline;
    cursor:pointer;
    padding:4px 0;
    margin-top:4px;
  }

  footer{
    text-align:center;
    margin-top:18px;
    font-size:10.5px;
    color:#4a564b;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">// SUNUCU GİRİŞİ</div>

  <div class="panel">

    <div id="msg" class="msg"></div>

    <!-- LOGIN VIEW -->
    <div id="view-login">
      <h1>OTURUM AÇ</h1>
      <p class="sub">Ana site hesabınla giriş yap</p>

      <div class="field">
        <label for="login-email">E-posta</label>
        <input type="email" id="login-email" placeholder="ornek@mail.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="login-password">Şifre</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button class="btn" id="btn-login">Giriş Yap</button>

      <div class="toggle-row">
        Hesabın yok mu? <button id="go-signup">Kayıt ol</button>
      </div>
    </div>

    <!-- SIGNUP VIEW -->
    <div id="view-signup" class="hidden">
      <h1>HESAP OLUŞTUR</h1>
      <p class="sub">Bu, ana sitedeki hesabını oluşturur</p>

      <div class="field">
        <label for="signup-email">E-posta</label>
        <input type="email" id="signup-email" placeholder="ornek@mail.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="signup-password">Şifre</label>
        <input type="password" id="signup-password" placeholder="en az 6 karakter" autocomplete="new-password">
      </div>

      <button class="btn" id="btn-signup">Kayıt Ol</button>

      <div class="toggle-row">
        Zaten hesabın var mı? <button id="go-login">Giriş yap</button>
      </div>
    </div>

    <!-- ACCOUNT / MC SETUP VIEW -->
    <div id="view-account" class="hidden">
      <h1 id="account-title">HOŞ GELDİN</h1>
      <p class="sub" id="account-email">-</p>

      <!-- shown if no mc_accounts row yet -->
      <div id="mc-setup" class="hidden">
        <div class="field">
          <label for="mc-username">Minecraft kullanıcı adın</label>
          <input type="text" id="mc-username" placeholder="Steve123" autocomplete="off">
        </div>
        <button class="btn" id="btn-mc-save">Kaydet</button>
      </div>

      <!-- shown if mc_accounts row already exists -->
      <div id="mc-status" class="hidden">
        <div class="status-row">
          <div class="dot" id="status-dot"></div>
          <div class="status-text" id="status-text">-</div>
        </div>
        <button class="link-btn" id="btn-mc-edit">Kullanıcı adını değiştir</button>

        <div id="mc-edit-form" class="hidden" style="margin-top:14px;">
          <div class="field">
            <label for="mc-username-edit">Yeni Minecraft kullanıcı adı</label>
            <input type="text" id="mc-username-edit" placeholder="Steve123" autocomplete="off">
          </div>
          <button class="btn" id="btn-mc-update">Kaydet</button>
          <button class="btn secondary" id="btn-mc-cancel-edit" style="margin-top:8px;">Vazgeç</button>
        </div>
      </div>

      <button class="btn danger" id="btn-logout" style="margin-top:20px;">Çıkış Yap</button>
    </div>

  </div>

  <footer>sunucu.example.net</footer>
</div>

<script>
  // ---- Supabase bağlantısı ----
  const SUPABASE_URL = "https://jnuckqaiutmkiquptvzu.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpudWNrcWFpdXRta2lxdXB0dnp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0MDgzMTAsImV4cCI6MjA4ODk4NDMxMH0.sP_FoTrYOFWiIS7PdaFYtR1JbP5vGf_KLgc_jh7zhZY";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---- DOM referansları ----
  const viewLogin   = document.getElementById('view-login');
  const viewSignup  = document.getElementById('view-signup');
  const viewAccount = document.getElementById('view-account');
  const msgBox      = document.getElementById('msg');

  function showMsg(text, isError){
    msgBox.textContent = text;
    msgBox.classList.toggle('error', !!isError);
    msgBox.classList.add('show');
  }
  function clearMsg(){
    msgBox.classList.remove('show','error');
    msgBox.textContent = '';
  }
  function showView(view){
    [viewLogin, viewSignup, viewAccount].forEach(v => v.classList.add('hidden'));
    view.classList.remove('hidden');
    clearMsg();
  }

  // ---- Görünüm geçişleri ----
  document.getElementById('go-signup').addEventListener('click', () => showView(viewSignup));
  document.getElementById('go-login').addEventListener('click', () => showView(viewLogin));

  // ---- Giriş ----
  document.getElementById('btn-login').addEventListener('click', async () => {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if(!email || !password){ showMsg('E-posta ve şifre gerekli.', true); return; }

    const btn = document.getElementById('btn-login');
    btn.disabled = true; btn.textContent = 'Giriş yapılıyor...';

    const { error } = await sb.auth.signInWithPassword({ email, password });

    btn.disabled = false; btn.textContent = 'Giriş Yap';

    if(error){
      showMsg('Giriş başarısız: ' + error.message, true);
      return;
    }
    await loadAccountView();
  });

  // ---- Kayıt ----
  document.getElementById('btn-signup').addEventListener('click', async () => {
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    if(!email || !password){ showMsg('E-posta ve şifre gerekli.', true); return; }
    if(password.length < 6){ showMsg('Şifre en az 6 karakter olmalı.', true); return; }

    const btn = document.getElementById('btn-signup');
    btn.disabled = true; btn.textContent = 'Kayıt olunuyor...';

    const { data, error } = await sb.auth.signUp({ email, password });

    btn.disabled = false; btn.textContent = 'Kayıt Ol';

    if(error){
      showMsg('Kayıt başarısız: ' + error.message, true);
      return;
    }

    if(!data.session){
      showMsg('Kayıt başarılı. Devam etmek için e-postanı onaylaman gerekebilir.');
      return;
    }

    await loadAccountView();
  });

  // ---- Çıkış ----
  document.getElementById('btn-logout').addEventListener('click', async () => {
    await sb.auth.signOut();
    showView(viewLogin);
  });

  // ---- MC kullanıcı adı kaydet ----
  document.getElementById('btn-mc-save').addEventListener('click', async () => {
    const username = document.getElementById('mc-username').value.trim();
    if(!username || username.length < 3){
      showMsg('Geçerli bir kullanıcı adı gir (en az 3 karakter).', true);
      return;
    }

    const { data: { user } } = await sb.auth.getUser();
    if(!user){ showMsg('Oturum bulunamadı, tekrar giriş yap.', true); showView(viewLogin); return; }

    const btn = document.getElementById('btn-mc-save');
    btn.disabled = true; btn.textContent = 'Kaydediliyor...';

    const { error } = await sb.from('mc_accounts').insert({
      id: user.id,
      minecraft_username: username
    });

    btn.disabled = false; btn.textContent = 'Kaydet';

    if(error){
      showMsg('Kayıt başarısız: ' + error.message, true);
      return;
    }

    await loadAccountView();
  });

  // ---- Kullanıcı adı değiştir: formu aç/kapa ----
  let currentMcUsername = '';

  document.getElementById('btn-mc-edit').addEventListener('click', () => {
    document.getElementById('mc-username-edit').value = currentMcUsername;
    document.getElementById('mc-edit-form').classList.remove('hidden');
    document.getElementById('btn-mc-edit').classList.add('hidden');
    clearMsg();
  });

  document.getElementById('btn-mc-cancel-edit').addEventListener('click', () => {
    document.getElementById('mc-edit-form').classList.add('hidden');
    document.getElementById('btn-mc-edit').classList.remove('hidden');
    clearMsg();
  });

  document.getElementById('btn-mc-update').addEventListener('click', async () => {
    const username = document.getElementById('mc-username-edit').value.trim();
    if(!username || username.length < 3){
      showMsg('Geçerli bir kullanıcı adı gir (en az 3 karakter).', true);
      return;
    }
    if(username === currentMcUsername){
      showMsg('Bu zaten mevcut kullanıcı adın.', true);
      return;
    }

    const { data: { user } } = await sb.auth.getUser();
    if(!user){ showMsg('Oturum bulunamadı, tekrar giriş yap.', true); showView(viewLogin); return; }

    const btn = document.getElementById('btn-mc-update');
    btn.disabled = true; btn.textContent = 'Kaydediliyor...';

    // Kullanıcı adı değişince dogrulama durumu sıfırlanır; oyuncu
    // Minecraft'ta yeni adıyla /login yaptığında otomatik tekrar dogrulanir.
    const { error } = await sb
      .from('mc_accounts')
      .update({ minecraft_username: username, is_verified: false })
      .eq('id', user.id);

    btn.disabled = false; btn.textContent = 'Kaydet';

    if(error){
      if(error.code === '23505' || /duplicate|unique/i.test(error.message)){
        showMsg('Bu kullanıcı adı başka bir hesap tarafından kullanılıyor.', true);
      } else {
        showMsg('Güncelleme başarısız: ' + error.message, true);
      }
      return;
    }

    document.getElementById('mc-edit-form').classList.add('hidden');
    document.getElementById('btn-mc-edit').classList.remove('hidden');
    await loadAccountView();
  });

  // ---- Hesap görünümünü yükle (login sonrası) ----
  async function loadAccountView(){
    const { data: { user } } = await sb.auth.getUser();
    if(!user){ showView(viewLogin); return; }

    showView(viewAccount);
    document.getElementById('account-email').textContent = user.email;

    const setupBox  = document.getElementById('mc-setup');
    const statusBox = document.getElementById('mc-status');
    setupBox.classList.add('hidden');
    statusBox.classList.add('hidden');

    const { data: row, error } = await sb
      .from('mc_accounts')
      .select('minecraft_username, is_verified')
      .eq('id', user.id)
      .maybeSingle();

    if(error){
      showMsg('Hesap bilgisi alınamadı: ' + error.message, true);
      return;
    }

    if(!row){
      // Henüz Minecraft kullanıcı adı belirlenmemiş
      currentMcUsername = '';
      setupBox.classList.remove('hidden');
    } else {
      // Hesap zaten bağlı
      currentMcUsername = row.minecraft_username;
      document.getElementById('mc-edit-form').classList.add('hidden');
      document.getElementById('btn-mc-edit').classList.remove('hidden');

      statusBox.classList.remove('hidden');
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      dot.classList.toggle('ok', !!row.is_verified);
      text.innerHTML = `<b>${row.minecraft_username}</b><br>` +
        (row.is_verified
          ? 'Sunucuya bağlandı, oyun içinde giriş yapabilirsin.'
          : 'Kayıt alındı, sunucuya senkronize ediliyor...');
    }
  }

  // ---- Sayfa yüklenince mevcut oturumu kontrol et ----
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if(session){
      await loadAccountView();
    } else {
      showView(viewLogin);
    }
  })();

  // ---- Oturum durumu değişirse görünümü senkronize et ----
  sb.auth.onAuthStateChange((event, session) => {
    if(event === 'SIGNED_OUT'){
      showView(viewLogin);
    }
  });
</script>

</body>
</html>
